<section class="cms-page">
  <div class="cms-heading">
    <span>আমার প্রোফাইল</span>
    <h2>আমার প্রোফাইল</h2>
    <p>পাবলিক পোর্টালে আপনার সাংবাদিক পরিচিতি কীভাবে দেখাবে তা নিয়ন্ত্রণ করুন।</p>
  </div>

  <section class="cms-panel">
    <form class="cms-form" (ngSubmit)="save()">
      <label>
        <span>বাংলা নাম</span>
        <input type="text" name="displayName" [(ngModel)]="profileForm.displayName">
      </label>
      <label>
        <span>পদবি</span>
        <select name="designation" [(ngModel)]="profileForm.designation">
          @for (designation of designationOptions; track designation) {
            <option [value]="designation">{{ designation }}</option>
          }
        </select>
      </label>
      <label class="full-width">
        <span>জীবনী</span>
        <textarea name="bio" [(ngModel)]="profileForm.bio" rows="4" maxlength="500"></textarea>
      </label>
      <label>
        <span>প্রোফাইল ছবি URL</span>
        <input type="url" name="profileImageUrl" [(ngModel)]="profileForm.profileImageUrl">
      </label>
      <label>
        <span>Facebook URL</span>
        <input type="url" name="facebookUrl" [(ngModel)]="profileForm.facebookUrl">
      </label>
      <label>
        <span>Twitter/X URL</span>
        <input type="url" name="twitterUrl" [(ngModel)]="profileForm.twitterUrl">
      </label>
      <label>
        <span>Public Email</span>
        <input type="email" name="emailPublic" [(ngModel)]="profileForm.emailPublic">
      </label>
      <label>
        <span>পোর্টালে দেখান</span>
        <input type="checkbox" name="isPublic" [(ngModel)]="profileForm.isPublic">
      </label>
      <div class="form-actions full-width">
        <button type="submit" class="admin-btn">সংরক্ষণ করুন</button>
      </div>
    </form>
  </section>
</section>
