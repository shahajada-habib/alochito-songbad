<section class="cms-page">
  <div class="cms-heading">
    <span>{{ t('myProfile') }}</span>
    <h2>{{ t('myProfile') }}</h2>
    <p>{{ t('profileHelp') }}</p>
  </div>

  <section class="cms-panel">
    <form class="cms-form" (ngSubmit)="save()">
      <label>
        <span>{{ t('displayName') }}</span>
        <input type="text" name="displayName" [(ngModel)]="profileForm.displayName">
      </label>
      <label>
        <span>{{ t('designation') }}</span>
        <select name="designation" [(ngModel)]="profileForm.designation">
          @for (designation of designationOptions; track designation) {
            <option [value]="designation">{{ designationLabel(designation) }}</option>
          }
        </select>
      </label>
      <label class="full-width">
        <span>{{ t('bio') }}</span>
        <textarea name="bio" [(ngModel)]="profileForm.bio" rows="4" maxlength="500"></textarea>
      </label>
      <label>
        <span>{{ t('profileImageUrl') }}</span>
        <input type="url" name="profileImageUrl" [(ngModel)]="profileForm.profileImageUrl">
      </label>
      <label>
        <span>{{ t('uploadProfilePhoto') }}</span>
        <input
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif"
          [disabled]="isUploadingProfilePhoto"
          (change)="uploadProfilePhoto($event)">
      </label>
      <div class="profile-photo-preview full-width">
        @if (profilePreviewUrl()) {
          <img [src]="profilePreviewUrl()" [alt]="profileForm.displayName || t('profilePhoto')" (error)="markProfilePreviewFailed()">
        } @else {
          <div class="profile-photo-fallback" aria-hidden="true">{{ profileInitials() }}</div>
        }
        <div>
          <strong>{{ t('profilePhotoPreview') }}</strong>
          <p>{{ isUploadingProfilePhoto ? t('uploadingPhoto') : t('profilePhotoHelp') }}</p>
        </div>
      </div>
      <label>
        <span>{{ t('facebookUrl') }}</span>
        <input type="url" name="facebookUrl" [(ngModel)]="profileForm.facebookUrl">
      </label>
      <label>
        <span>{{ t('twitterUrl') }}</span>
        <input type="url" name="twitterUrl" [(ngModel)]="profileForm.twitterUrl">
      </label>
      <label>
        <span>{{ t('publicEmail') }}</span>
        <input type="email" name="emailPublic" [(ngModel)]="profileForm.emailPublic">
      </label>
      <label>
        <span>{{ t('showOnPortal') }}</span>
        <input type="checkbox" name="isPublic" [(ngModel)]="profileForm.isPublic">
      </label>
      <div class="form-actions full-width">
        <button type="submit" class="admin-btn">{{ t('save') }}</button>
      </div>
    </form>
  </section>
</section>
