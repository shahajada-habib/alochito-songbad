<section class="media-operations-workspace" [class.bangla-mode]="i18n.language() === 'bn'">
  <aside class="operations-subnav" aria-label="Media Operations navigation">
    <div class="subnav-head">
      <div class="subnav-brand">
        <span class="subnav-icon">O</span>
        <div>
          <strong>{{ t('mediaOperations') }}</strong>
          <p>{{ t('newsroomCommandCenter') }}</p>
        </div>
      </div>
    </div>

    <nav class="subnav-groups">
      @for (group of navGroups; track group.title) {
        <section class="subnav-group">
          <h3>{{ t(group.title) }}</h3>
          <div class="subnav-links">
            @for (item of group.items; track item.link) {
              <a
                [routerLink]="item.link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              >
                <span class="nav-icon">{{ item.icon }}</span>
                <span class="nav-label">{{ t(item.label) }}</span>
              </a>
            }
          </div>
        </section>
      }
    </nav>
    <div class="subnav-version">{{ t('mediaOperationsVersion') }}</div>
  </aside>

  <main class="operations-workspace-main">
    <router-outlet></router-outlet>
  </main>
</section>
